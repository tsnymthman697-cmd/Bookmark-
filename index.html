
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="منصة بيع وشراء الكتب">

    <title>تسجيل الدخول | BookMarket</title>
  <link rel="stylesheet" href="style.css">
  
</head>

<body>

    <!-- رأس الصفحة -->
    <header>
        <h1>📚 BookMarket</h1>
        <p>منصتك لبيع وشراء الكتب</p>
    </header>

    <!-- محتوى تسجيل الدخول -->
    <main>

        <section>

            <h2>تسجيل الدخول</h2>

            <p>مرحباً بك في منصة بيع وشراء الكتب</p>

            <form action="index.php" method="post">

                <!-- البريد الإلكتروني -->
                <div>
                    <label for="email">البريد الإلكتروني:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="أدخل بريدك الإلكتروني"
                        required>
                </div>

                <br>

                <!-- كلمة المرور -->
                <div>
                    <label for="password">كلمة المرور:</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="أدخل كلمة المرور"
                        required>
                </div>

                <br>

                <!-- زر تسجيل الدخول -->
                <button type="submit">
                    تسجيل الدخول
                </button>

            </form>

            <hr>

            <!-- إنشاء حساب جديد -->
            <p>
                ليس لديك حساب؟
                <a href="register.html">إنشاء حساب جديد</a>
            </p>

            <!-- التواصل معنا -->
            <p>
                هل تحتاج إلى مساعدة؟
                <a href="contact.html">تواصل معنا</a>
            </p>

        </section>

    </main>

    <!-- تذييل الصفحة -->
    <footer>
        <p>جميع الحقوق محفوظة © 2026 BookMarket</p>
    </footer>
  <script src="js/script.js"></script>

</body>
</html>
